services:
  backend:
    image: ghcr.io/doubledeltas/mrd-backend:latest
    container_name: mrdash-backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ddeltas-net
      - mrd-net

  frontend:
    image: ghcr.io/doubledeltas/mrd-frontend:latest
    container_name: mrdash-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ddeltas-net
      - mrd-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/mrd.conf:/etc/nginx/conf.d/mrd.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ddeltas-net
      - mrd-net
      
networks:
  mrd-net:
  ddeltas-net:
    external: true