name: Build and publish Docker images

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'bridge/**'
      - 'discord-bot/**'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: [self-hosted, mrdash]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/doubledeltas/mrd-backend:latest
            ghcr.io/doubledeltas/mrd-backend:${{ github.sha }}

  frontend:
    runs-on: [self-hosted, mrdash]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=https://dash.ddeltas.kro.kr/api
            VITE_BASE_PATH=/
          tags: |
            ghcr.io/doubledeltas/mrd-frontend:latest
            ghcr.io/doubledeltas/mrd-frontend:${{ github.sha }}

  bridge:
    runs-on: [self-hosted, mrdash]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./bridge
          push: true
          tags: |
            ghcr.io/doubledeltas/mrd-bridge:latest
            ghcr.io/doubledeltas/mrd-bridge:${{ github.sha }}

  discord-bot:
    runs-on: [self-hosted, mrdash]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./discord-bot
          push: true
          tags: |
            ghcr.io/doubledeltas/mrd-discord-bot:latest
            ghcr.io/doubledeltas/mrd-discord-bot:${{ github.sha }}

  # 이미지 빌드가 모두 끝나면 서버(/srv/mrdash)에서 update.sh로 pull + 재기동
  deploy:
    needs: [backend, frontend, bridge, discord-bot]
    runs-on: [self-hosted, mrdash]
    concurrency:
      group: mrdash-deploy
      cancel-in-progress: false
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images and restart containers
        working-directory: /srv/mrdash
        run: ./update.sh
