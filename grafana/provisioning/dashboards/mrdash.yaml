# Grafana 대시보드 프로비저닝 — 이 파일을 Grafana 컨테이너의 /etc/grafana/provisioning/dashboards/에,
# grafana/dashboards/ 폴더를 /var/lib/grafana/dashboards/mrdash에 마운트한다 (grafana/README.md 참고).
apiVersion: 1

providers:
  - name: mrdash
    folder: MRDash
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/mrdash
